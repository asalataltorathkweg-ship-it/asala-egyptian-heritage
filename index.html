  let currentCategory = 'all';

  function renderProducts(items) {
    const grid = document.getElementById("productsGrid");
    if (items.length === 0) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; font-size:18px; color:#8B7355;">عذراً، لم نجد منتجات مطابقة لبحثك.</div>`;
      return;
    }

    let cardsContent = "";
    items.forEach(product => {
      const message = encodeURIComponent("السلام عليكم 🌹\nأريد الاستفسار وطلب هذا المنتج من أصالة التراث:\n\n📦 *" + product.name + "*\n💰 السعر: " + product.price + "\n\nشكراً لكم.");
      const waLink = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + message;

      cardsContent += `
        <div class="card">
          <div class="card-img">
            <img src="${product.image}" alt="${product.name}" loading="lazy" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?auto=format&fit=crop&w=600&q=80';">
          </div>
          <div class="card-body">
            <h3>${product.name}</h3>
            <div class="desc">${product.desc}</div>
            <div class="price">${product.price}</div>
            <a href="${waLink}" target="_blank" class="btn-order">💬 اطلب الآن عبر واتساب</a>
          </div>
        </div>
      `;
    });
    grid.innerHTML = cardsContent;
  }

  function filterCategory(category, btn) {
    currentCategory = category;
    document.querySelectorAll('.cat-bin, .cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function filterProducts() {
    applyFilters();
  }

  function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = products.filter(p => {
      const matchesCat = (currentCategory === 'all' || p.category === currentCategory);
      const matchesSearch = p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
      return matchesCat && matchesSearch;
    });
    renderProducts(filtered);
  }

  renderProducts(products);
